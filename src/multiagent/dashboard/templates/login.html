<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{ business }} · Sign in</title>
<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0e1116;color:#e6e9ef;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{background:#171b22;border:1px solid #272d38;border-radius:14px;padding:30px;
    width:320px;text-align:center}
  h1{font-size:18px;margin:0 0 4px}
  p{color:#8b94a3;font-size:12px;margin:0 0 20px}
  input{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:9px;
    border:1px solid #272d38;background:#0e1116;color:#e6e9ef;font:inherit;margin-bottom:12px}
  button{width:100%;padding:10px;border-radius:9px;border:none;background:#6ea8fe;
    color:#06121f;font-weight:600;font:inherit;cursor:pointer}
  .err{color:#f85149;font-size:12px;margin-bottom:10px}
</style>
</head>
<body>
  <form class="box" method="post">
    <h1>🎬 {{ business }}</h1>
    <p>Agent dashboard</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus />
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
